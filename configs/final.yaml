# 最终实验配置：合成数据（easy / medium）+ CleanML 真实数据集（Credit / EEG / Marketing）
datasets:
  # --- 合成数据（共 2 个）---
  - id: synth_easy
    difficulty: easy
    seed: 42
  - id: synth_medium
    difficulty: medium
    seed: 7

  # --- CleanML 真实数据（共 3 个）---
  - id: Credit
    source: cleanml
  - id: EEG
    source: cleanml
  - id: Marketing
    source: cleanml

  # --- CleanML 干净基座 + 受控缺陷（共 2 个）---
  # Marketing_base 跳过：含非数值列，不兼容缺陷注入流程
  - id: Credit_base
    source: cleanml_base
    difficulty: easy
    seed: 42
  - id: EEG_base
    source: cleanml_base
    difficulty: easy
    seed: 42

  # --- 真实基座 + 受控缺陷（共 4 个）---
  # breast_cancer 跑全模型，其余只跑 xgb
  - id: breast_cancer
    source: real_base
    difficulty: easy
    seed: 42
    models: [xgb, rf, lr]
  - id: digits
    source: real_base
    difficulty: easy
    seed: 42
  - id: wine
    source: real_base
    difficulty: easy
    seed: 42
  - id: pima_diabetes
    source: real_base
    difficulty: easy
    seed: 42

base:
  n_rows: 10000
  n_features: 30
  test_size: 0.2

# 下游分类模型：xgb（XGBoost）/ rf（RandomForest）/ lr（LogisticRegression）
# 全局默认只跑 xgb；如需在特定数据集上跑多模型，在该数据集的 models 字段中覆盖
eval_models:
  - xgb

methods:
  - no_clean
  - rule_based
  - agent

# Agent 消融：Planner × Reviewer 正交 + Prompt 策略对比
ablations:
  - name: agent_full
    use_planner: true
    use_reviewer: true
    prompt_strategy: cot
  - name: agent_no_reviewer
    use_planner: true
    use_reviewer: false
    prompt_strategy: cot
  - name: agent_no_planner
    use_planner: false
    use_reviewer: true
    prompt_strategy: cot
  - name: agent_zero_shot
    use_planner: true
    use_reviewer: true
    prompt_strategy: zero_shot
  - name: agent_few_shot
    use_planner: true
    use_reviewer: true
    prompt_strategy: few_shot

model: deepseek-chat
out_dir: results
