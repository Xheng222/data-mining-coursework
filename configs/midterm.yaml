# 中期实验配置：在合成数据上对比 no_clean / rule_based / agent，并围绕 agent_full 跑 Reviewer 与 Planner 消融。
datasets:
  - id: synth_easy
    difficulty: easy
    seed: 42
  - id: synth_medium
    difficulty: medium
    seed: 7

base:
  n_rows: 10000
  n_features: 30
  test_size: 0.2          # 冻结的干净测试集比例

methods:
  - no_clean
  - rule_based
  - agent

# Agent 消融：以 agent_full 为基准，分别关掉 Reviewer / Planner，隔离单个维度的贡献
ablations:
  # Planner × Reviewer 正交消融（固定 cot 策略）
  - name: agent_full
    use_planner: true
    use_reviewer: true
    prompt_strategy: cot
  - name: agent_no_reviewer    # 隔离 Reviewer（反思）维度
    use_planner: true
    use_reviewer: false
    prompt_strategy: cot
  - name: agent_no_planner     # 隔离 Planner（规划）维度
    use_planner: false
    use_reviewer: true
    prompt_strategy: cot

  # Prompt 策略消融（固定 planner + reviewer，对比 zero_shot / few_shot / cot）
  - name: agent_zero_shot
    use_planner: true
    use_reviewer: true
    prompt_strategy: zero_shot
  - name: agent_few_shot
    use_planner: true
    use_reviewer: true
    prompt_strategy: few_shot

model: deepseek-chat
out_dir: results
